name: RISE ETF Daily Market Auto-Updater

on:
  schedule:
    # 평일(월~금) 16:30 KST (07:30 UTC) 자동 정기 실행
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # Actions 탭에서 수동 즉시 실행 가능

permissions:
  contents: write # 깃허브 봇이 저장소에 커밋/푸시할 수 있는 쓰기 권한

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Daily Market Data Updater
        run: |
          python scripts/update_daily.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily market data: $(date '+%Y-%m-%d')" && git push)
