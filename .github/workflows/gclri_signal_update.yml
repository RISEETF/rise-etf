name: GCLRI signal engine

on:
  workflow_dispatch:
  # Automatic execution is owned by intelligence_daily.yml.

permissions:
  contents: write

concurrency:
  group: rise-data-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit test signal engine
        run: python -m unittest tests.test_gclri_signals -v
      - name: Build signals
        run: python scripts/build_gclri_signals.py
      - name: Commit signal outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signals/latest.json data/signals/history.json
          if git diff --cached --quiet; then
            echo "No signal changes"
          else
            git commit -m "Update GCLRI signals"
            git push
          fi
