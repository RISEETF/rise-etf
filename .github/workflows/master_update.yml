name: RISE official instrument master

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/master_update.yml
      - scripts/update_official_master.py
      - scripts/record_pipeline_status.py
  schedule:
    # Weekdays 09:17-18:47 KST, plus 07:17 KST pre-open check.
    # GitHub scheduling and source publication can be delayed; not real-time.
    - cron: '17,47 0-9 * * 1-5'
    - cron: '17 22 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rise-data-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: main
      - uses: actions/setup-python@v5
        id: setup
        with:
          python-version: '3.11'
      - name: Test parser and integrity rules
        id: preflight
        run: python -m unittest tests.test_official_master tests.test_master_changes tests.test_pipeline tests.test_pipeline_status -v
      - name: Build official instrument master
        id: collect
        run: python scripts/update_official_master.py
      - name: Record workflow outcome including preflight failures
        if: always() && steps.checkout.outcome == 'success'
        env:
          PIPELINE_STAGES: '{"setup":"${{ steps.setup.outcome }}","preflight":"${{ steps.preflight.outcome }}","collect":"${{ steps.collect.outcome }}"}'
        run: python scripts/record_pipeline_status.py master
      - name: Save a changed master
        if: always() && steps.checkout.outcome == 'success'
        run: |
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add data/master/ data/quality/ data/raw/rise_finder/ OFFICIAL_MASTER_VALIDATION.md
          git add data/operations/
          if [ -f data/master_collection_status.json ]; then
            git add data/master_collection_status.json data/master_runs/
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update official RISE instrument master'
            git pull --rebase origin main
            git push
          fi
