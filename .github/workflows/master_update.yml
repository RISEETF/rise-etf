name: RISE official instrument master

on:
  schedule:
    - cron: '0 21 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rise-official-master
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test parser and integrity rules
        run: python -m unittest discover -s tests -v
      - name: Build official instrument master
        run: python scripts/update_official_master.py
      - name: Save a changed master
        run: |
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add data/master/ data/quality/ data/raw/rise_finder/ OFFICIAL_MASTER_VALIDATION.md
          if ! git diff --cached --quiet; then
            git commit -m 'Update official RISE instrument master'
            git push
          fi
