name: RISE official instrument master

on:
  schedule:
    # Weekdays 09:17-18:47 KST, plus 07:17 KST pre-open check.
    # GitHub scheduling and source publication can be delayed; not real-time.
    - cron: '17,47 0-9 * * 1-5'
    - cron: '17 22 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rise-data-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test parser and integrity rules
        run: python -m unittest discover -s tests -v
      - name: Build official instrument master
        run: python scripts/update_official_master.py
      - name: Save a changed master
        if: always()
        run: |
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add data/master/ data/quality/ data/raw/rise_finder/ OFFICIAL_MASTER_VALIDATION.md
          if [ -f data/master_collection_status.json ]; then
            git add data/master_collection_status.json data/master_runs/
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update official RISE instrument master'
            git push
          fi
