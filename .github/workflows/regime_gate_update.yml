name: Regime transition gate

on:
  workflow_dispatch:
  # Automatic execution is owned by intelligence_daily.yml.

permissions:
  contents: write

concurrency:
  group: rise-intelligence-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test regime gate
        run: python -m unittest tests.test_regime_gate -v
      - name: Build regime gate
        run: python scripts/build_regime_gate.py
      - name: Commit regime gate outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/regime/gate_latest.json data/regime/gate_history.json
          if git diff --cached --quiet; then
            echo "No regime gate changes"
          else
            git commit -m "Update regime transition gate"
            git push
          fi
