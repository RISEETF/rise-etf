name: KRX ETF primary ledger

on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_krx_etf.py'
      - 'scripts/build_etf_investigations.py'
      - 'scripts/build_etf_market_metrics.py'
      - 'scripts/backfill_etf_return_baselines.py'
      - 'tests/test_etf_return_baselines.py'
      - 'tests/test_etf_market_metrics.py'
      - 'tests/test_etf_investigations.py'
      - 'scripts/reconcile_krx_master.py'
      - 'scripts/krx_inventory.py'
      - 'tests/test_krx_inventory.py'
      - 'scripts/collect_kind_notices.py'
      - 'tests/test_kind_notices.py'
      - 'tests/test_krx_etf.py'
      - '.github/workflows/krx_etf_update.yml'
  schedule:
    # 08:00 KST, Monday-Friday (23:00 UTC on the prior day)
    - cron: '0 23 * * 0-4'
    # After-market check at 18:30 KST.
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rise-data-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify parser and accumulation rules
        run: python -m unittest tests.test_krx_etf tests.test_kind_notices tests.test_krx_inventory -v
      - name: Restore cumulative KRX database
        uses: actions/cache/restore@v4
        with:
          path: var/krx_etf.sqlite
          key: krx-etf-db-${{ github.run_id }}
          restore-keys: krx-etf-db-
      - name: Collect official KRX ETF snapshot
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: python scripts/collect_krx_etf.py
      - name: Freeze and verify daily ledger
        run: |
          python - <<'PY'
          import json, shutil, sqlite3
          from pathlib import Path
          stage = Path('var/sealed')
          (stage/'krx-output').mkdir(parents=True)
          shutil.copyfile('var/krx-output/receipt.json', stage/'krx-output/receipt.json')
          r = json.loads((stage/'krx-output/receipt.json').read_text())
          if (r['status'],r['source'],r['source_role']) != ('SUCCESS','KRX_OPEN_API_ETF_DAILY','PRIMARY'):
              raise ValueError('invalid source receipt')
          with sqlite3.connect('file:var/krx_etf.sqlite?mode=ro', uri=True) as src, sqlite3.connect(stage/'krx_etf.sqlite') as dst:
              src.backup(dst)
          with sqlite3.connect('file:var/sealed/krx_etf.sqlite?mode=ro&immutable=1', uri=True) as db:
              if db.execute('pragma integrity_check').fetchall() != [('ok',)]:
                  raise ValueError('invalid standalone database')
              n, day, stamp = db.execute('select count(*),max(observation_date),max(julianday(retrieved_at)) from snapshots').fetchone()
              if n != r['delta']['total'] or day != r['observation_date'] or stamp > db.execute('select julianday(?)',(r['retrieved_at'],)).fetchone()[0]:
                  raise ValueError('receipt mismatch')
              coverage = dict(db.execute('select field,count(distinct ticker) from snapshots where observation_date=? group by field',(day,)))
              required = {'close','nav','volume','trading_value','market_cap','net_assets','listed_shares'}
              if set(coverage) != required or any(v != r['record_count'] for v in coverage.values()):
                  raise ValueError('incomplete seven-field snapshot')
          PY
      - name: Publish sealed bridge pair
        uses: actions/upload-artifact@v4
        with:
          name: krx-etf-${{ github.run_id }}
          path: var/sealed/
          if-no-files-found: error
          retention-days: 30
      - name: Publish collection summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          receipt = json.loads(Path('var/krx-output/receipt.json').read_text())
          delta = receipt['delta']
          print('## KRX ETF primary ledger')
          print(f"- Observation date: `{receipt['observation_date']}`")
          print(f"- ETF records: `{receipt['record_count']:,}`")
          print(f"- New / revised / unchanged: `{delta['new']:,}` / `{delta['revisions']:,}` / `{delta['unchanged']:,}`")
          print(f"- Cumulative observations: `{delta['total']:,}`")
          PY
      - name: Save cumulative KRX database cache
        uses: actions/cache/save@v4
        if: success()
        with:
          path: var/krx_etf.sqlite
          key: krx-etf-db-${{ github.run_id }}
      - name: Preserve collector diagnostics separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-diagnostics-${{ github.run_id }}
          path: |
            var/krx-output/validation_failure.json
            var/kind-raw/
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish identity comparison and attempt status
        if: always()
        run: |
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          for path in data/quality/krx_master_reconciliation.json data/quality/krx_rise_inventory.json data/krx_collection_status.json; do
            if [ -e "$path" ]; then git add "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Update KRX and RISE identity comparison'
            git pull --rebase origin main
            git push
          fi
