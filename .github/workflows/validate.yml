name: Validate portal and data
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_research_db.py
      - run: python scripts/build_universe.py
      - run: python scripts/build_research_rs.py
      - run: python scripts/verify_apple_actions.py
      - run: node tests/test_portal.cjs
      - run: node --check portal.js
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/test_master_portal.cjs
