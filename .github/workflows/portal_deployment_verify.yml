name: RISE Portal public deployment verification
on:
  workflow_run:
    workflows: ["RISE Intelligence daily orchestration"]
    types: [completed]
  schedule:
    - cron: '15 2,8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/verify_portal_deployment.py'
      - 'scripts/import_etf_provider_export.py'
      - 'tests/test_etf_provider_export.py'
      - '.github/workflows/portal_deployment_verify.yml'
permissions:
  contents: read
  pages: read
concurrency:
  group: rise-portal-public-verify
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install XLSX reader
        run: python -m pip install openpyxl==3.1.5
      - name: Test ETF provider import (offline)
        run: python -m unittest discover -s tests -p 'test_etf_provider_export.py' -v
      - name: Verify public Pages build and exact content
        env:
          GH_TOKEN: ${{ github.token }}
          PORTAL_VERIFY_ATTEMPTS: '12'
          PORTAL_VERIFY_WAIT_SECONDS: '20'
        run: python scripts/verify_portal_deployment.py
