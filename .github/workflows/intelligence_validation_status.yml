name: Intelligence v1 validation status

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Regime transition gate"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'scripts/build_validation_status.py'
      - 'data/intelligence/glossary_ko.json'
      - '.github/workflows/intelligence_validation_status.yml'

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build validation status
        run: python scripts/build_validation_status.py
      - name: Test validation layer
        run: python -m unittest tests.test_intelligence_validation -v
      - name: Commit validation status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/v1_status.json
          if git diff --cached --quiet; then
            echo "No validation changes"
          else
            git commit -m "Update Intelligence v1 validation status"
            git push
          fi
