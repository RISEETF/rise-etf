name: Intelligence v1 validation status

on:
  workflow_dispatch:
  # Automatic execution is owned by intelligence_daily.yml.

permissions:
  contents: write

concurrency:
  group: rise-data-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build validation status
        run: python scripts/build_validation_status.py
      - name: Test validation layer
        run: python -m unittest tests.test_intelligence_validation -v
      - name: Commit validation status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/v1_status.json
          if git diff --cached --quiet; then
            echo "No validation changes"
          else
            git commit -m "Update Intelligence v1 validation status"
            git push
          fi
