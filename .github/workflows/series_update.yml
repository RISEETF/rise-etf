name: Capture dated price and FX series
on:
  push:
    branches: [main]
    paths:
      - scripts/build_research_rs.py
      - .github/workflows/series_update.yml
      - scripts/collect_hana_fx.py
      - data/fx_policy.json
  schedule:
    # 08:15 KST Mon-Sat: recapture the previous Korean session on a new local date.
    - cron: '15 23 * * 0-5'
    # 14:15 KST Tue-Sat: New York has crossed midnight in both DST and standard time.
    # Saturday includes Friday's US observations; same-day bars remain excluded.
    - cron: '15 5 * * 2-6'
    # 17:15 KST Mon-Fri: preserve the existing afternoon refresh.
    - cron: '15 8 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rise-data-writer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: main
      - uses: actions/setup-python@v5
        id: setup
        with:
          python-version: '3.11'
      - name: Validate market-data dependencies
        id: preflight
        run: >-
          python -m unittest
          tests.test_pipeline tests.test_series tests.test_overseas tests.test_asof
          tests.test_research_rs tests.test_alignment tests.test_universe
          tests.test_official_master tests.test_master_changes tests.test_apple_actions tests.test_pipeline_status tests.test_hana_fx -v
      - name: Collect series
        id: collect
        continue-on-error: true
        run: python scripts/collect_series.py
      - name: Collect overseas series
        id: overseas
        continue-on-error: true
        run: python scripts/collect_overseas.py
      - name: Collect Hana final-notice midpoint
        id: hana
        continue-on-error: true
        run: python scripts/collect_hana_fx.py
      - name: Rebuild unified database and publish coverage
        id: database
        run: python scripts/build_research_db.py
      - name: Rebuild exposure candidates
        id: universe
        run: python scripts/build_universe.py
      - name: Publish exploratory price RS with explicit FX policy
        id: rs
        run: python scripts/build_research_rs.py
      - name: Record workflow outcome including preflight failures
        if: always() && steps.checkout.outcome == 'success'
        env:
          PIPELINE_STAGES: '{"setup":"${{ steps.setup.outcome }}","preflight":"${{ steps.preflight.outcome }}","collect":"${{ steps.collect.outcome }}","overseas":"${{ steps.overseas.outcome }}","hana":"${{ steps.hana.outcome }}","database":"${{ steps.database.outcome }}","universe":"${{ steps.universe.outcome }}","rs":"${{ steps.rs.outcome }}"}'
        run: python scripts/record_pipeline_status.py series
      - name: Save captures and failure records
        if: always() && steps.checkout.outcome == 'success'
        run: |
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Capture dated price and FX series'
            git pull --rebase origin main
            git push
          fi
      - name: Report capture failure
        if: steps.collect.outcome == 'failure' || steps.overseas.outcome == 'failure' || steps.hana.outcome == 'failure'
        run: exit 1
