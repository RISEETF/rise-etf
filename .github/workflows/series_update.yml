name: Capture dated price and FX series
on:
  schedule:
    - cron: '15 8 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rise-data-writer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - name: Collect series
        id: collect
        continue-on-error: true
        run: python scripts/collect_series.py
      - name: Rebuild database and publish coverage
        run: python scripts/build_research_db.py
      - name: Save captures and failure records
        if: always()
        run: |
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Capture dated price and FX series'
            git push
          fi
      - name: Report capture failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
