name: Inspect Hana public FX source
on:
  push:
    branches: [research/hana-fx-source-20261015]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public FX form structure
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse
          url='https://www.kebhana.com/cms/rate/wpfxd651_01i_01.do'
          form={'ajax':'true','curCd':'USD','pbldDvCd':'0','tmpInqStrDt':'2026-10-14','inqStrDt':'20261014','inqKindCd':'1','requestTarget':'searchContentDiv'}
          req=urllib.request.Request(url,data=urllib.parse.urlencode(form).encode(),headers={'User-Agent':'RISE-research/0.2','Referer':'https://www.kebhana.com/cms/rate/wpfxd651_01i.do','Content-Type':'application/x-www-form-urlencoded'})
          with urllib.request.urlopen(req,timeout=40) as r: print('HISTORICAL_RESPONSE',r.read().decode('utf-8'))
          PY
