name: Inspect Hana public FX source
on:
  push:
    branches: [research/hana-fx-source-20261015]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public FX form structure
        run: |
          python - <<'PY'
          import urllib.request, re
          url='https://www.kebhana.com/cms/rate/wpfxd651_01i.do'
          with urllib.request.urlopen(url,timeout=40) as r: text=r.read().decode('utf-8')
          for script in re.findall(r'<script\\b[^>]*[\\s\\S]*?</script>',text,re.I): print(script[:12000])
          PY
