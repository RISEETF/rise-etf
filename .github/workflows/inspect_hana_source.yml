name: Inspect Hana public FX source
on:
  push:
    branches: [research/hana-fx-source-20261015]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public FX form structure
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, re
          from html.parser import HTMLParser
          url='https://www.kebhana.com/cms/rate/wpfxd651_01i_01.do'
          form={'ajax':'true','curCd':'USD','pbldDvCd':'3','tmpInqStrDt':'20261014','inqStrDt':'20261014','inqKindCd':'1','requestTarget':'searchContentDiv'}
          try:
              req=urllib.request.Request(url,data=urllib.parse.urlencode(form).encode(),headers={'User-Agent':'RISE-research/0.2','Referer':'https://www.kebhana.com/cms/rate/wpfxd651_01i.do','Content-Type':'application/x-www-form-urlencoded'})
              with urllib.request.urlopen(req,timeout=40) as r:
                  text=r.read().decode('utf-8')
                  print('HTTP',r.status,'BYTES',len(text))
              print(text[:24000])
          except Exception as exc:
              print('SOURCE_FETCH_FAILED',type(exc).__name__,str(exc)[:250])
          PY
