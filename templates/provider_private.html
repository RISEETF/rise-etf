<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RISE 개인용 ETF 비교</title>
<style>
:root{font:15px/1.6 system-ui,sans-serif;color:#193044;background:#f1f5f7}body{margin:0}header{background:#102a3b;color:white;padding:26px 5vw}h1{margin:0;font-size:25px}main{max-width:1440px;margin:24px auto;padding:0 24px}.cards{display:flex;gap:14px;flex-wrap:wrap}.card,section{background:white;border:1px solid #dce5ea;border-radius:12px;padding:18px;margin-bottom:16px}.card{flex:1;min-width:180px}.card b{font-size:24px;display:block;color:#006f76}.note{color:#526675;font-size:13px}input,select,button{font:inherit;padding:9px;border:1px solid #a7bac6;border-radius:6px}button{background:#e8f6f5;color:#005c63;cursor:pointer}input[type=search]{min-width:260px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;padding:10px;border-bottom:1px solid #e4eaed}th{background:#eef4f5;font-size:13px}td.num{text-align:right}tbody tr:hover{background:#f1faf9}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}h2{font-size:19px;margin:0 0 10px}a{color:#00737b}#detail{display:none}.pill{font-size:12px;background:#fff0cf;border-radius:4px;padding:3px 8px}
</style>
<header><h1>RISE 개인용 ETF 비교</h1><div>국내 ETF 보조자료 · 국내 ETF 보조자료 · KRX 종목 기준</div></header>
<main><div class="cards" id="summary"></div><section><h2>자료 기준</h2><div id="basis"></div><p class="note">다운로드일과 수치 관측일은 다릅니다. 수익률·보수·구성종목은 제공처 자료이며 KRX 확정값을 대체하지 않습니다. TOP3는 전체 포트폴리오가 아닙니다.</p><div id="missing"></div></section>
<section><h2>ETF 찾기</h2><div class="toolbar"><input id="search" type="search" placeholder="종목명 또는 코드"><select id="category"><option value="">전체 유형</option></select><label><input id="rise" type="checkbox"> RISE만</label><button id="compare">선택 ETF 비교</button><span id="count"></span></div><div class="scroll"><table><thead><tr><th>비교</th><th>코드</th><th>ETF</th><th>유형</th><th>총보수(%)</th><th>TER(%)</th><th>순자산(억원)</th><th>1개월(%)</th></tr></thead><tbody id="rows"></tbody></table></div><div class="toolbar"><button id="previous">이전</button><span id="page"></span><button id="next">다음</button></div></section>
<section id="detail"><h2 id="detail-title"></h2><div id="details" class="scroll"></div></section>
<section><h2>변경사항</h2><div id="changes"></div><p class="note">제공처 목록의 신규·누락은 상장·폐지 확정이 아닙니다. 법적 상장폐지는 거래소 공시 확인이 필요합니다. 미국 상장 ETF는 별도 원천 검증 전까지 이 화면에 포함하지 않습니다.</p></section></main>
<script type="application/json" id="data">__PROVIDER_DATA__</script>
<script>
'use strict';const d=JSON.parse(document.querySelector('#data').textContent),q=s=>document.querySelector(s),selected=new Set();let page=0,filtered=[];
const fmt=v=>v===null||v===undefined?'미확인':new Intl.NumberFormat('ko-KR',{maximumFractionDigits:4}).format(v);
function text(tag,value){const e=document.createElement(tag);e.textContent=value;return e;}
function card(title,value){const e=text('div',title);e.className='card';e.append(text('b',value));q('#summary').append(e);}
card('확보한 국내 ETF',d.records.length);card('KRX RISE',d.reconciliation.krx_rise_count);card('국내 ETF 보조자료 RISE',d.reconciliation.provider_rise_count);card('누적 파일',d.capture_count);
q('#basis').textContent=`파일 입수일: ${d.metadata.retrieved_at_utc.slice(0,10)} / 화면 기준일: ${d.metadata.screen_date||'미확인'} / 수치 관측일: ${d.metadata.observation_date||'파일 내 미표기'} / KRX: ${d.reconciliation.krx_observation_date}`;
q('#missing').textContent='국내 ETF 보조자료 미수록 RISE: '+(d.reconciliation.missing_from_provider.map(r=>`${r.code} ${r.name}`).join(', ')||'없음');
for(const c of [...new Set(d.records.map(r=>r.category))].sort()){const o=text('option',c);o.value=c;q('#category').append(o);}
function draw(){const needle=q('#search').value.trim().toLowerCase();filtered=d.records.filter(r=>(!q('#rise').checked||r.name.startsWith('RISE '))&&(!q('#category').value||r.category===q('#category').value)&&(r.name.toLowerCase().includes(needle)||r.code.toLowerCase().includes(needle)));const pages=Math.max(1,Math.ceil(filtered.length/30));page=Math.min(page,pages-1);q('#rows').replaceChildren();for(const r of filtered.slice(page*30,page*30+30)){const tr=document.createElement('tr'),td=document.createElement('td'),cb=document.createElement('input');cb.type='checkbox';cb.checked=selected.has(r.code);cb.setAttribute('aria-label',r.name+' 비교');cb.onchange=()=>{cb.checked?selected.add(r.code):selected.delete(r.code);q('#compare').textContent=`선택 ETF 비교 (${selected.size})`;};td.append(cb);tr.append(td,text('td',r.code));const name=document.createElement('td'),b=text('button',r.name);b.onclick=()=>details([r]);name.append(b);tr.append(name,text('td',r.category));for(const key of ['총보수(%)','합성총보수(TER)(%)','순자산(억원)','1개월(%)']){const cell=text('td',fmt(r.metrics[key]));cell.className='num';tr.append(cell);}q('#rows').append(tr);}q('#count').textContent=`${filtered.length}종목`;q('#page').textContent=`${page+1} / ${pages}`;q('#previous').disabled=page===0;q('#next').disabled=page===pages-1;}
function details(rs){q('#detail').style.display='block';q('#detail-title').textContent=rs.length===1?'ETF 상세':'ETF 비교';q('#details').replaceChildren();if(!rs.length){q('#details').textContent='비교할 ETF를 선택하세요.';return;}const table=document.createElement('table'),head=document.createElement('tr');head.append(text('th','항목'));rs.forEach(r=>head.append(text('th',r.name+' ('+r.code+')')));table.append(head);const metrics=Object.keys(rs[0].metrics);for(const key of ['운용사','유형',...metrics,'TOP1','TOP2','TOP3']){const row=document.createElement('tr');row.append(text('th',key));for(const r of rs){let value=key==='운용사'?r.provider:key==='유형'?r.category:fmt(r.metrics[key]);if(key.startsWith('TOP')){const h=r.holdings_top3[Number(key.slice(3))-1];value=(h.name||'미확인')+' / '+fmt(h.weight_pct)+'%';}row.append(text('td',value));}table.append(row);}q('#details').append(table);q('#detail').scrollIntoView({behavior:'smooth',block:'start'});}
q('#compare').onclick=()=>details(d.records.filter(r=>selected.has(r.code)));q('#search').oninput=q('#category').onchange=q('#rise').onchange=()=>{page=0;draw();};q('#previous').onclick=()=>{page--;draw();};q('#next').onclick=()=>{page++;draw();};
q('#changes').textContent=d.changes?`직전 확보본 대비 신규 ${d.changes.new_in_provider.length} / 미수록 ${d.changes.missing_in_provider.length} / 항목 변경 ${d.changes.changed.length}`:'첫 확보본입니다. 변화나 신규 상장으로 판정하지 않습니다.';draw();
</script></html>
